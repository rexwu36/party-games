<style>
/* Layout: a stage. Host = projector screen with a hidden player; phones = four answer tiles */
:root{
  --bg:#141033; --bg2:#231b55; --panel:#fff; --panel-ink:#141033; --ink:#fff; --muted:#b8b0e8;
  --a:#f25f5c; --b:#1fb5a8; --c:#9b5de5; --d:#f39a2b; --e:#3a7bd5; --f:#e0479e; --g:#4f9a2a; --h:#8d6e63; --good:#2bc46d; --bad:#e8434b;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Space Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 80% 0%,var(--bg2),var(--bg) 60%) fixed;color:var(--ink);font-family:var(--f-display);font-size:17px;line-height:1.5;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{margin:0;font-weight:900;line-height:1.2;text-wrap:balance}
p{margin:0}
.brand{font-weight:900;letter-spacing:.06em;color:var(--muted)}
.brand b{color:var(--d)}
.card{background:var(--panel);color:var(--panel-ink);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.narrow{max-width:440px;width:100%;margin:0 auto}
label{font-weight:700;display:flex;flex-direction:column;gap:6px}
input,textarea,select{font:inherit;color:var(--panel-ink);background:#f1effa;border:2px solid #d8d3f0;border-radius:10px;padding:12px;width:100%}
input.code{font-family:var(--f-num);font-size:2rem;text-align:center;letter-spacing:.25em}
textarea{min-height:300px;font-size:.95rem;line-height:1.6}
button{font:inherit;font-weight:900;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--panel-ink);color:#fff;min-height:52px}
button.go{background:var(--good)}
button.ghost{background:transparent;color:inherit;border:2px solid currentColor}
button.link{background:none;color:var(--muted);text-decoration:underline;min-height:0;padding:6px;font-weight:700}
button.sm{min-height:38px;padding:6px 12px;font-size:.92rem}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:4px solid var(--d);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 160px}
.err{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}
.card .muted{color:#6b6491}
.songlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto}
.songlist li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:1px solid #e6e2f6;padding:4px 0}
.songlist .n{font-family:var(--f-num);color:#6b6491}
.songlist .nm{overflow-wrap:anywhere}
.tag{font-size:.8rem;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
.tag.ok{background:#d9f5e5;color:#17703f}
.tag.no{background:#fde7d2;color:#8a4a07;text-decoration:none}
.bigcode{font-family:var(--f-num);font-size:clamp(3rem,10vw,6.5rem);letter-spacing:.12em;line-height:1;color:var(--d)}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.qr{background:#fff;padding:12px;border-radius:12px}
.qr img,.qr canvas{display:block;width:200px;height:200px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg2);border:2px solid #4a3f8f;border-radius:99px;padding:6px 14px;font-weight:700}
.chip.off{opacity:.4}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qnum{font-family:var(--f-num);color:var(--muted)}
.stage{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;max-height:46vh;width:100%;max-width:100%;margin:0 auto}
[hidden]{display:none!important}
#yt-park{position:absolute;left:-9999px;top:0;width:320px;height:180px;z-index:5;border-radius:16px;overflow:hidden;background:#000}
#yt-park iframe,#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,var(--c),var(--bg2));z-index:2;padding:16px}
.cover .big{font-size:clamp(1.6rem,5vw,3rem);font-weight:900}
.eq{display:flex;gap:8px;justify-content:center;height:70px;align-items:flex-end;margin-bottom:12px}
.eq i{display:block;width:14px;background:#fff;border-radius:4px;height:30%}
@media (prefers-reduced-motion:no-preference){.eq i{animation:eq 1s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
 @keyframes eq{0%,100%{height:20%}50%{height:100%}}
 .pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}}
.timer{font-family:var(--f-num);font-size:2.4rem;width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:var(--c);flex:0 0 auto}
.answered{font-family:var(--f-num);text-align:center}
.answered b{font-size:2.4rem;display:block;line-height:1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:14px;border-radius:14px;padding:16px;font-weight:900;font-size:clamp(1rem,2.4vw,1.5rem);color:#fff;min-height:76px;text-align:left}
.opt .k{font-family:var(--f-num);background:rgba(0,0,0,.22);border-radius:8px;width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto}
.o0{background:var(--a)}.o1{background:var(--b)}.o2{background:var(--c)}.o3{background:var(--d)}.o4{background:var(--e)}.o5{background:var(--f)}.o6{background:var(--g)}.o7{background:var(--h)}
.opts.many{grid-template-columns:repeat(4,minmax(0,1fr))}.opts.many .opt{font-size:clamp(.9rem,1.7vw,1.2rem);min-height:64px;padding:12px;gap:10px}.opts.many .opt .k{width:34px;height:34px}
.pad.many .opt{min-height:68px;font-size:.92rem;padding:8px;gap:4px}.pad.many .opt .k{width:30px;height:30px;font-size:1rem}
.opt.dim{opacity:.25}
.opt .cnt{margin-left:auto;font-family:var(--f-num);white-space:nowrap}
.opt.right{outline:5px solid #fff;outline-offset:-5px}
.board{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:3em minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--bg2);border-radius:12px;padding:12px 16px;font-weight:900;font-size:1.2rem}
.brow .r{font-family:var(--f-num);color:var(--muted)}
.brow .s{font-family:var(--f-num)}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;text-align:center}
.pod{border-radius:14px 14px 0 0;padding:14px 8px;font-weight:900;display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
.pod .nm{font-size:clamp(1rem,3vw,1.6rem);overflow-wrap:anywhere}
.pod .s{font-family:var(--f-num)}
.p1{background:var(--d);height:240px}.p2{background:var(--b);height:180px}.p3{background:var(--a);height:140px}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:56vh}
.pad .opt{flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:1.05rem;min-height:120px}
.pad .opt .k{width:52px;height:52px;font-size:1.5rem}
.status{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.status .big{font-size:2.2rem;font-weight:900}
.status.good{background:var(--good);border-radius:16px}
.status.bad{background:var(--bad);border-radius:16px}
.pts{font-family:var(--f-num);font-size:2rem}
.me{display:flex;justify-content:space-between;font-weight:900;padding:8px 4px}
.me .s{font-family:var(--f-num)}
.note{background:var(--d);color:var(--panel-ink);border-radius:10px;padding:8px 12px;font-weight:700}
@media (max-width:640px){.opts.many{grid-template-columns:1fr 1fr}.lobby{grid-template-columns:1fr}.qr{justify-self:center}.opt{min-height:60px;padding:12px}}
</style>
</head>

/* ---------- song list parsing ---------- */
function parseSongs(text){
  const out=[];
  for(let line of text.replace(/\r/g,"").split("\n")){
    line=line.trim();if(!line||line.startsWith("#"))continue;
    let vid=null,start=0;
    const m=line.match(/https?:\/\/\S+/);
    if(m){
      const u=m[0];
      const id=(u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([\w-]{11})/)||[])[1];
      if(id)vid=id;
      const t=(u.match(/[?&]t=(\d+)/)||[])[1];if(t)start=+t;
      line=line.replace(u," ");
    }
    let year=null;const ym=line.match(/[\[［](\d{4})[\]］]/);if(ym){year=+ym[1];line=line.replace(ym[0]," ")}
    let chorus=null;const cm=line.match(/[副難]\s*(\d{1,2}):(\d{2})/);if(cm){chorus=(+cm[1])*60+(+cm[2]);line=line.replace(cm[0]," ")}
    const tm=line.match(/\s(\d{1,2}):(\d{2})\s*$/)||line.match(/\s(\d{1,4})\s*$/);
    if(tm){start=tm.length===3?(+tm[1])*60+(+tm[2]):+tm[1];line=line.slice(0,tm.index)}
    const name=line.replace(/\s+/g," ").trim();
    if(name)out.push({name,vid,start,year,chorus});
  }
  return out;
}
const PARSED=new Map();
function parsedList(p){if(!PARSED.has(p))PARSED.set(p,parseSongs(p.text));return PARSED.get(p)}
function buildQuestions(songs,random,tag){
  tag=tag||"zh";
  const order=random?shuffle(songs):songs.slice();
  const pool=new Map();const add=(n,y)=>{if(!pool.has(n))pool.set(n,y||null)};
  for(const x of songs)add(x.name,x.year);
  for(const p of PLAYLISTS)if(p.tag===tag)for(const x of parsedList(p))add(x.name,x.year);
  if(tag==="zh")for(const [n,y] of BANK)add(n,y);
  for(const [n,y] of (BANK_X[tag]||[]))add(n,y);
  const names=[...pool.keys()];
  const N=Math.min(8,names.length);
  const artist=n=>n.split(/[〈《「(（]/)[0].trim();
  const used=new Map();
  return order.map(s=>{
    const scored=names.filter(n=>n!==s.name).map(n=>{
      const y=pool.get(n);
      let d=(s.year&&y)?Math.abs(s.year-y):5;
      if(artist(n)===artist(s.name))d-=3;
      d+=(used.get(n)||0)*1.5;
      return {n,d:d+Math.random()*2.5};
    }).sort((a,b)=>a.d-b.d);
    const near=scored.slice(0,Math.max(N+5,14));
    const cand=shuffle(near).slice(0,N-1).map(o=>o.n);
    for(const n of cand)used.set(n,(used.get(n)||0)+1);
    const opts=shuffle([s.name,...cand]);
    return {...s,opts,ans:opts.indexOf(s.name)};
  });
}

function openRoom(qs,limit,clip,mode,tag){
  const G={qs,limit,clip,mode,tag,qi:-1,phase:"lobby",players:new Map(),deadline:0,start:0,tick:null,peer:null,code:"",ytErr:null};
  keepAwake();
  app.replaceChildren(h("p",{class:"muted",style:"text-align:center;margin-top:20vh"},"正在開房間⋯"));
  window.addEventListener("yterror",e=>{G.ytErr=e.detail;const c=$("#ytmsg");if(c)c.textContent="這支影片不能嵌入播放（錯誤 "+e.detail+"），請主持人手動播放這首。"});
  function online(p){return Date.now()-p.seen<25000}
  async function create(){
    for(let b=0;b<BROKERS.length;b++){
      const code=String(b+1)+String(Math.floor(10000+Math.random()*90000));
      const base=TOPIC_BASE+code+"/";
      try{
        const cl=await mqttConnect(BROKERS[b],{will:{topic:base+"hello",payload:"",retain:true,qos:1}});
        G.code=code;G.cl=cl;G.base=base;
        cl.on("connect",()=>{netBanner(false);if(G.offAt){if(G.phase==="question")G.deadline+=Date.now()-G.offAt;G.offAt=0}cl.publish(base+"hello",JSON.stringify({at:Date.now()}),{retain:true,qos:1});pushAll()});
        cl.on("offline",()=>{netBanner(true);if(!G.offAt)G.offAt=Date.now()});
        cl.on("message",(topic,buf)=>{let d;try{d=JSON.parse(buf.toString())}catch(e){return}onData(d)});
        cl.subscribe(base+"up",{qos:1});
        cl.publish(base+"hello",JSON.stringify({at:Date.now()}),{retain:true,qos:1});
        let sig="";
        setInterval(()=>{if(G.phase!=="lobby")return;const s=[...G.players.values()].map(p=>p.name+online(p)).join();if(s!==sig){sig=s;render()}},4000);
        render();return;
      }catch(e){console.warn("broker failed",BROKERS[b].url,e)}
    }
    app.replaceChildren(h("div",{class:"narrow",style:"margin-top:20vh;text-align:center;display:flex;flex-direction:column;gap:12px"},
      h("p",{class:"err"},"連不上連線伺服器"),h("p",{class:"muted"},"請確認這台電腦有網路，或換一個網路（例如手機熱點）後重新整理。")));
  }
  create();
  function closeRoom(){try{G.cl.publish(G.base+"hello","",{retain:true,qos:1},()=>G.cl.end())}catch(e){}}
  function sendTo(pid,m){try{G.cl&&G.cl.publish(G.base+"p/"+pid,JSON.stringify(m),{qos:1})}catch(e){}}
  function send(p,m){if(p.pid)sendTo(p.pid,m)}
  function ranked(){return [...G.players.values()].sort((a,b)=>b.score-a.score)}
  function stateFor(p){
    const r=ranked();const q=G.qs[G.qi];
    const base={t:"state",phase:G.phase,qi:G.qi,total:G.qs.length,score:p.score,rank:r.indexOf(p)+1,count:r.length,name:p.name};
    if(G.phase==="question")return {...base,opts:q.opts,answered:p.ans!=null};
    if(G.phase==="reveal"||G.phase==="board")return {...base,last:p.last,correct:q.name};
    return base;
  }
  function pushAll(){for(const p of G.players.values())send(p,stateFor(p))}
  function onData(d){
    if(!d||typeof d!=="object"||typeof d.pid!=="string")return;
    const pid=d.pid.slice(0,64);
    let p=[...G.players.values()].find(x=>x.pid===pid);
    if(d.t==="join"){
      const name=String(d.name||"").trim().slice(0,12);
      if(!name){sendTo(pid,{t:"err",m:"請輸入暱稱"});return}
      const same=G.players.get(name);
      if(same&&same.pid!==pid){sendTo(pid,{t:"err",m:"這個暱稱已經有人用了，換一個吧"});return}
      if(p&&p.name!==name)G.players.delete(p.name);
      p=same;
      if(!p){p={name,pid,score:0,ans:null,last:null,seen:0};G.players.set(name,p)}
      p.seen=Date.now();send(p,stateFor(p));if(G.phase==="lobby")render();return;
    }
    if(!p)return;
    if(d.t==="ping"){p.seen=Date.now();
      if(d.ph!==undefined&&(d.ph!==G.phase||d.qi!==G.qi||(G.phase==="question"&&(p.ans!=null)!==(d.a===1))))send(p,stateFor(p));
      return}
    if(d.t==="bye"){p.seen=0;if(G.phase==="lobby")render();return}
    if(d.t==="ans"){
      p.seen=Date.now();
      if(G.phase!=="question"||d.q!==G.qi||p.ans!=null)return;
      const c=d.c|0;if(c<0||c>=G.qs[G.qi].opts.length)return;
      const hm=Date.now()-G.start,cm=+d.ms;p.ans={c,ms:(cm>=0&&cm<hm)?cm:hm};send(p,stateFor(p));renderAnswered();
      if([...G.players.values()].filter(online).every(x=>x.ans!=null))reveal();
    }
  }
  function playClip(q,full){
    G.ytErr=null;
    if(!q.vid||!YTP||!YTP.loadVideoById)return false;
    const st=((G.mode==="chorus"||G.mode==="hard")&&q.chorus!=null)?q.chorus:(q.start||0);
    const o={videoId:q.vid,startSeconds:st};if(!full)o.endSeconds=st+(G.clip||G.limit+3);
    try{YTP.loadVideoById(o);YTP.unMute&&YTP.unMute();YTP.setVolume&&YTP.setVolume(100);return true}catch(e){return false}
  }
  function stopMusic(){try{YTP&&YTP.stopVideo&&YTP.stopVideo()}catch(e){}}
  async function nextQ(){
    G.qi++;
    if(G.qi>=G.qs.length){stopMusic();G.phase="final";render();pushAll();return}
    for(const p of G.players.values()){p.ans=null;p.last=null}
    const q=G.qs[G.qi];
    if(q.vid)await loadYT();
    G.phase="question";G.start=Date.now();G.deadline=G.start+G.limit*1000;
    render();pushAll();
    playClip(q,false);
    clearInterval(G.tick);
    G.tick=setInterval(()=>{const t=$("#timer");if(t)t.textContent=Math.max(0,Math.ceil((G.deadline-Date.now())/1000));if(Date.now()>=G.deadline&&!G.offAt)reveal()},200);
  }
  function reveal(){
    if(G.phase!=="question")return;
    clearInterval(G.tick);
    const q=G.qs[G.qi];
    for(const p of G.players.values()){
      if(p.ans&&p.ans.c===q.ans){const g=Math.round(500+500*Math.max(0,1-p.ans.ms/(G.limit*1000)));p.score+=g;p.last={ok:true,g}}
      else p.last={ok:false,g:0,none:!p.ans};
    }
    G.phase="reveal";render();pushAll();
    if(q.vid&&!G.ytErr)playClip(q,true);
  }
  function renderAnswered(){const el=$("#answered");if(el)el.firstChild.textContent=[...G.players.values()].filter(p=>p.ans!=null).length}
  function stageEl(q,covered){
    const st=h("div",{class:"stage"});
    if(q.vid){
      setTimeout(()=>mountPlayer(st,covered),0);
    }else{
      parkPlayer();
      st.style.aspectRatio="auto";st.style.background="transparent";
      st.append(h("div",{class:"cover",style:"position:static;border-radius:16px;padding:28px"},h("div",{},
        covered?h("div",{class:"eq"},h("i"),h("i"),h("i"),h("i"),h("i")):null,
        h("div",{class:"big"},covered?"這是哪首歌？":"答案："+q.name),
        covered?h("p",{style:"margin-top:8px"},"主持人請播放這首歌"):null)));
    }
    return st;
  }
  function render(){
    const q=G.qs[G.qi];const players=[...G.players.values()];
    if(G.phase!=="question"&&G.phase!=="reveal")parkPlayer();
    if(G.phase==="lobby"){
      const url=baseURL()+"#"+G.code;const qr=h("div",{class:"qr"});
      app.replaceChildren(
        h("header",{},brand()),
        h("div",{class:"lobby"},
          h("div",{style:"display:flex;flex-direction:column;gap:10px;min-width:0"},
            h("p",{class:"muted",style:"font-size:1.2rem"},"用手機打開這個網址，輸入房間碼："),
            h("p",{style:"font-weight:900;font-size:1.2rem;overflow-wrap:anywhere"},baseURL()),
            h("div",{class:"bigcode"},G.code)),qr),
        h("div",{class:"row",style:"justify-content:space-between"},h("h2",{},`已加入 ${players.length} 人`),
          h("button",{class:"go",disabled:!players.length,onclick:nextQ},`開始（共 ${G.qs.length} 首）`)),
        h("div",{class:"chips"},players.length?players.map(p=>h("span",{class:"chip pop"+(online(p)?"":" off")},p.name)):h("p",{class:"muted"},"等待玩家加入⋯")));
      try{new QRCode(qr,{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}catch(e){qr.remove()}
      return;
    }
    if(G.phase==="question"){
      app.replaceChildren(
        h("div",{class:"qtop"},h("span",{class:"qnum"},`第 ${G.qi+1} / ${G.qs.length} 首`),brand()),
        stageEl(q,true),
        h("div",{class:"row",style:"justify-content:space-between"},
          h("div",{class:"timer",id:"timer"},G.limit),
          h("div",{class:"answered",id:"answered"},h("b",{},"0"),"人已作答"),
          h("div",{class:"row"},q.vid?h("button",{class:"ghost sm",onclick:()=>playClip(q,false)},"再播一次"):null,h("button",{class:"ghost sm",onclick:reveal},"直接公布"))),
        h("div",{class:"opts"+(q.opts.length>4?" many":"")},q.opts.map((o,i)=>h("div",{class:"opt o"+i},h("span",{class:"k"},KEYS[i]),h("span",{},o)))));
      renderAnswered();return;
    }
    if(G.phase==="reveal"){
      const counts=q.opts.map((_,i)=>players.filter(p=>p.ans&&p.ans.c===i).length);const isLast=G.qi===G.qs.length-1;
      app.replaceChildren(
        h("div",{class:"qtop"},h("span",{class:"qnum"},`第 ${G.qi+1} / ${G.qs.length} 首`),brand()),
        stageEl(q,false),
        h("div",{class:"opts"+(q.opts.length>4?" many":"")},q.opts.map((o,i)=>h("div",{class:"opt o"+i+(i===q.ans?" right pop":" dim")},h("span",{class:"k"},i===q.ans?"✓":KEYS[i]),h("span",{},o),h("span",{class:"cnt"},counts[i]+" 人")))),
        h("div",{class:"row",style:"justify-content:flex-end"},
          q.vid?h("button",{class:"ghost",onclick:stopMusic},"停止音樂"):null,
          h("button",{class:"go",onclick:()=>{G.phase="board";render();pushAll()}},"看排行榜"),
          isLast?null:h("button",{class:"ghost",onclick:nextQ},"下一首")));
      return;
    }
    if(G.phase==="board"){
      const r=ranked().slice(0,5);const isLast=G.qi===G.qs.length-1;
      app.replaceChildren(
        h("div",{class:"qtop"},h("h1",{},"目前排行"),brand()),
        h("div",{class:"board"},r.map((p,i)=>h("div",{class:"brow pop"},h("span",{class:"r"},"#"+(i+1)),h("span",{class:"nm"},p.name),h("span",{class:"s"},p.score)))),
        h("div",{class:"row",style:"justify-content:flex-end"},h("button",{class:"ghost",onclick:stopMusic},"停止音樂"),h("button",{class:"go",onclick:nextQ},isLast?"公布最終結果":"下一首")));
      return;
    }
    if(G.phase==="final"){
      const r=ranked();
      const pod=(p,cls,pl)=>p?h("div",{class:"pod pop "+cls},h("span",{style:"font-size:1.8rem"},pl),h("span",{class:"nm"},p.name),h("span",{class:"s"},p.score)):h("div",{});
      app.replaceChildren(
        h("div",{class:"qtop"},h("h1",{},"最終結果"),brand()),
        h("div",{class:"podium"},pod(r[1],"p2","🥈"),pod(r[0],"p1","🥇"),pod(r[2],"p3","🥉")),
        h("div",{class:"board"},r.slice(3).map((p,i)=>h("div",{class:"brow"},h("span",{class:"r"},"#"+(i+4)),h("span",{class:"nm"},p.name),h("span",{class:"s"},p.score)))),
        h("div",{class:"row",style:"justify-content:flex-end"},
          h("button",{class:"ghost",onclick:()=>{for(const p of G.players.values()){p.score=0;p.ans=null;p.last=null}G.qs=buildQuestions(G.qs.map(({name,vid,start,year,chorus})=>({name,vid,start,year,chorus})),true,G.tag);G.qi=-1;G.phase="lobby";render();pushAll()}},"同一群人再玩一次"),
          h("button",{class:"ghost",onclick:()=>{closeRoom();hostSetup()}},"換歌單、關閉房間")));
    }
  }
  document.addEventListener("keydown",e=>{
    if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName))return;
    if(e.key===" "||e.key==="Enter"){const b=app.querySelector("button.go:not(:disabled)");if(b){e.preventDefault();b.click()}}
  });
  window.addEventListener("beforeunload",e=>{if(G.phase!=="lobby"&&G.phase!=="final"){e.preventDefault();e.returnValue=""}});
}

/* ================= PLAYER ================= */
function startPlayer(code,name){
  const saved=LS.get("sp:player")||{};
  const tok=saved.tok||Math.random().toString(36).slice(2)+Date.now().toString(36);
  LS.set("sp:player",{name,tok,code});
  history.replaceState(null,"","#"+code);
  keepAwake();
  let cl=null,S=null,joined=false,dead=false,helloSeen=false,qStart=0,sentQ=-1,sentAt=0,pend=null,qRecv=0;
  const bi=+code[0]-1;
  if(!BROKERS[bi]){landing("房間碼不正確，請再確認一次");return}
  const base=TOPIC_BASE+code+"/",up=base+"up";
  const pub=m=>{try{cl&&cl.publish(up,JSON.stringify({...m,pid:tok}),{qos:1})}catch(e){}};
  // an answer the host has not confirmed yet is sent again (the host ignores duplicates)
  const resend=()=>{if(pend&&S&&S.phase==="question"&&S.qi===pend.q&&!S.answered){sentAt=Date.now();pub({t:"ans",...pend})}};
  status("連線中⋯","");
  (async()=>{
    for(let k=0;k<3&&!cl;k++){
      try{cl=await mqttConnect(BROKERS[bi],{will:{topic:up,payload:JSON.stringify({t:"bye",pid:tok}),qos:1}},12000)}
      catch(e){if(k<2)status("網路有點慢，再試一次⋯","請稍等，不用重新整理")}
    }
    if(!cl){status("連不上連線伺服器","請確認手機有網路；連 Wi-Fi 的話可以改用行動網路，然後重新整理");return}
    const askJoin=setInterval(()=>{if(!joined&&!dead)pub({t:"join",name})},2000);
    const noRoom=setTimeout(()=>{if(!joined){dead=true;clearInterval(askJoin);cl.end(true);landing("找不到房間 "+code+"。請確認房間碼，並請主持人重新整理頁面、重開房間")}},30000);
    cl.on("message",(topic,buf)=>{
      if(dead)return;const s=buf.toString();
      if(topic===base+"hello"){
        if(!s){if(joined)status("主持人暫時離線","等主持人回來⋯");return}
        helloSeen=true;pub({t:"join",name});resend();return;
      }
      let d;try{d=JSON.parse(s)}catch(e){return}onMsg(d);
    });
    cl.on("offline",()=>{if(!dead&&joined)status("連線中斷，重新連線中⋯","請保持這個頁面開著")});
    cl.subscribe([base+"hello",base+"p/"+tok],{qos:1},()=>pub({t:"join",name}));
    cl.on("connect",()=>{if(!dead){pub({t:"join",name});resend()}});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible"||dead)return;if(cl.connected)pub({t:"join",name});else try{cl.reconnect()}catch(e){}});
    setInterval(()=>{if(dead||!cl.connected)return;pub({t:"ping",ph:S?S.phase:"",qi:S?S.qi:-2,a:S&&S.answered?1:0});if(Date.now()-sentAt>3000)resend()},5000);
  })();
  function onMsg(d){
    if(!d||typeof d!=="object")return;
    if(d.t==="err"){dead=true;try{cl.end(true)}catch(e){}landing(d.m);return}
    if(d.t!=="state")return;
    joined=true;if(d.phase==="question"&&(!S||S.phase!=="question"||S.qi!==d.qi))qRecv=Date.now();S=d;draw();
  }
  function me(){return h("div",{class:"me"},h("span",{},S.name),h("span",{class:"s"},S.score+" 分"))}
  function status(big,small,cls){
    app.replaceChildren(h("div",{class:"narrow",style:"display:flex;flex-direction:column;gap:12px"},brand(),S?me():null,
      h("div",{class:"status "+(cls||"")+" pop"},h("div",{class:"big"},big),small?h("div",{},small):null)));
  }
  function draw(){
    if(S.phase==="lobby")return status("你已經加入了！","看大螢幕，等主持人開始");
    if(S.phase==="question"){
      if(S.answered||sentQ===S.qi)return status("已送出答案","等其他人作答⋯");
      app.replaceChildren(h("div",{class:"narrow",style:"display:flex;flex-direction:column;gap:12px"},
        h("div",{class:"me"},h("span",{class:"qnum"},`第 ${S.qi+1} / ${S.total} 首`),h("span",{class:"s"},S.score+" 分")),
        h("p",{style:"font-weight:900;text-align:center;font-size:1.2rem"},"🎵 仔細聽，這是哪首歌？"),
        h("div",{class:"pad"+(S.opts.length>4?" many":"")},S.opts.map((o,i)=>h("button",{class:"opt o"+i,onclick:()=>{
          app.querySelectorAll(".pad button").forEach(b=>b.disabled=true);
          pend={q:S.qi,c:i,ms:Date.now()-qRecv};pub({t:"ans",...pend});sentQ=S.qi;sentAt=Date.now();
          if(navigator.vibrate)navigator.vibrate(30);
        }},h("span",{class:"k"},KEYS[i]),h("span",{},o))))));
      return;
    }
    if(S.phase==="reveal"||S.phase==="board"){
      const L=S.last||{ok:false,none:true};
      if(L.ok)return status("答對了！",h("div",{},h("div",{class:"pts"},"+"+L.g),`目前第 ${S.rank} 名`),"good");
      return status(L.none?"時間到":"答錯了",h("div",{},"答案是 ",h("b",{},S.correct),h("div",{style:"margin-top:6px"},`目前第 ${S.rank} 名`)),"bad");
    }
    if(S.phase==="final")return status(S.rank<=3?["🥇","🥈","🥉"][S.rank-1]+" 第 "+S.rank+" 名！":"第 "+S.rank+" 名",`總分 ${S.score} 分，共 ${S.count} 人參加`,S.rank<=3?"good":"");
  }
}

if(!window.mqtt)app.replaceChildren(h("p",{class:"err",style:"margin-top:20vh;text-align:center"},"連線元件載入失敗，請確認網路後重新整理。"));
else landing();
</script>
