<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Load test bots</title>
<style>body{font:14px system-ui;background:#111;color:#eee;margin:16px}pre{white-space:pre-wrap}</style>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
</head><body>
<h3>模擬玩家</h3>
<p>用法：loadtest.html?game=song&amp;code=123456&amp;n=30&amp;proto=new&amp;lag=0&amp;drop=0</p>
<pre id="out"></pre>
<script>
// Simulated phones for the party games. Each bot speaks the same MQTT protocol as a real phone.
// lag  = extra random delay (ms, 0..lag) on every message in and out, like a slow network
// drop = chance per bot per 10 s that its connection is cut (it then reconnects like a phone would)
// proto=new also sends the resync fields and re-joins after a reconnect (the fixed phone code)
const P=new URLSearchParams(location.search);
const GAME=P.get("game")||"song",CODE=P.get("code"),N=+(P.get("n")||30),PROTO=P.get("proto")||"old";
const LAG=+(P.get("lag")||0),DROP=+(P.get("drop")||0),LOCK=+(P.get("lock")||0);
const BROKERS=[{url:"wss://public.cloud.shiftr.io",o:{username:"public",password:"public"}},{url:"wss://broker.emqx.io:8084/mqtt",o:{}},{url:"wss://test.mosquitto.org:8081",o:{}}];
const base="partygames-rexwu36/"+GAME+"/"+CODE+"/",up=base+"up";
const bk=BROKERS[+CODE[0]-1];
const later=f=>LAG?setTimeout(f,Math.random()*LAG):f();
const bots=[];const T0=Date.now();const log=[];
function mk(i){
  const b={i,name:(P.get("tag")||"bot")+String(i).padStart(2,"0"),tok:"bot"+i+"x"+Math.random().toString(36).slice(2,8),S:null,joined:0,conn:0,drops:0,reconn:0,answered:{},stateMsgs:0,cl:null};
  const pub=m=>later(()=>{try{b.cl.publish(up,JSON.stringify({...m,pid:b.tok}),{qos:1})}catch(e){}});
  b.pub=pub;
  b.resend=()=>{if(PROTO==="new"&&b.pend&&b.S&&b.S.phase==="question"&&b.S.qi===b.pend.q&&!b.S.answered){b.sentAt=Date.now();b.retries=(b.retries||0)+1;pub({t:"ans",...b.pend})}};
  b.cl=mqtt.connect(bk.url,{connectTimeout:15000,reconnectPeriod:2000,keepalive:20,clean:true,...bk.o,
    will:{topic:up,payload:JSON.stringify({t:"bye",pid:b.tok}),qos:1}});
  b.cl.on("connect",()=>{
    if(!b.conn){b.conn=Date.now()-T0}else{b.reconn++; if(PROTO==="new"){pub({t:"join",name:b.name});b.resend()}}
  });
  b.cl.subscribe([base+"hello",base+"p/"+b.tok],{qos:1},()=>pub({t:"join",name:b.name}));
  const ask=setInterval(()=>{if(!b.joined)pub({t:"join",name:b.name})},2000);
  b.cl.on("message",(topic,buf)=>later(()=>{
    const s=buf.toString();
    if(topic===base+"hello"){if(s){pub({t:"join",name:b.name});b.resend()}return}
    let d;try{d=JSON.parse(s)}catch(e){return}
    if(d.t==="err"){log.push(b.name+" err "+d.m);return}
    if(d.t!=="state")return;
    b.stateMsgs++;
    if(!b.joined){b.joined=Date.now()-T0;clearInterval(ask)}
    b.S=d;b.S.at=Date.now();
    if(d.phase==="question"&&!d.answered&&!b.answered[d.qi]){b.qRecv=Date.now();
      b.answered[d.qi]="pending";
      setTimeout(()=>{if(b.S.phase==="question"&&b.S.qi===d.qi){b.answered[d.qi]=true;b.sentAt=Date.now();b.pend={q:d.qi,c:Math.floor(Math.random()*d.opts.length),ms:Date.now()-b.qRecv};pub({t:"ans",...b.pend})}},1000+Math.random()*7000);
    }
  }));
  setInterval(()=>{if(!b.cl.connected)return;
    if(PROTO==="new"){pub({t:"ping",ph:b.S?b.S.phase:"",qi:b.S?b.S.qi:-2,a:b.S&&b.S.answered?1:0});if(Date.now()-b.sentAt>3000)b.resend()}else pub({t:"ping"})},PROTO==="new"?5000:8000);
  if(DROP)setInterval(()=>{if(Math.random()<DROP&&b.cl.connected){b.drops++;try{b.cl.stream.destroy()}catch(e){}}},10000);
  // screen lock: the phone is gone for 15-40 s, then comes back
  if(LOCK)setInterval(()=>{if(b.locked||!b.cl.connected||Math.random()>=LOCK)return;b.locked=true;b.locks=(b.locks||0)+1;b.cl.end(true,()=>{});
    setTimeout(()=>{b.locked=false;b.cl.reconnect()},15000+Math.random()*25000)},10000);
  return b;
}
for(let i=0;i<N;i++)setTimeout(()=>bots.push(mk(i)),i*150);
window.summary=()=>{
  const by={};for(const b of bots){const k=b.S?b.S.phase+"#"+b.S.qi+(b.S.phase==="question"?(b.S.answered?"(已答)":"(未答)"):""):"(沒收到)";by[k]=(by[k]||0)+1}
  return {bots:bots.length,connected:bots.filter(b=>b.cl.connected).length,joined:bots.filter(b=>b.joined).length,
    joinMs:bots.map(b=>b.joined).filter(Boolean).sort((a,c)=>a-c).filter((_,i,a)=>i===0||i===a.length-1),
    drops:bots.reduce((s,b)=>s+b.drops,0),locks:bots.reduce((s,b)=>s+(b.locks||0),0),locked:bots.filter(b=>b.locked).length,answerRetries:bots.reduce((s,b)=>s+(b.retries||0),0),reconnects:bots.reduce((s,b)=>s+b.reconn,0),states:by,errors:log.slice(-5)};
};
setInterval(()=>{document.getElementById("out").textContent=JSON.stringify(summary(),null,1)},1000);
</script></body></html>
