<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>派對遊戲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@500;700;900&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-size:17px;line-height:1.6;
  padding:max(40px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) 40px max(24px,env(safe-area-inset-left))}
main{max-width:540px;margin:7vh auto 0;display:flex;flex-direction:column;gap:22px}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:10px}
.script{font-family:"Playfair Display",serif;font-style:italic;color:var(--gold);font-size:1.25rem;letter-spacing:.06em}
h1{margin:0;font-size:clamp(2.4rem,9vw,3.4rem);line-height:1.15;letter-spacing:.2em;padding-left:.2em}
.rule{display:flex;align-items:center;gap:12px;color:var(--gold);width:220px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.big25{font-family:"Playfair Display",serif;font-weight:600;font-size:clamp(4.5rem,18vw,6.5rem);line-height:.9;background:linear-gradient(155deg,#fff4da 8%,#e6bd72 40%,#b4863c 58%,#f6dea6 80%,#d2a45a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 10px rgba(0,0,0,.4))}
.hero p{margin:0;color:var(--muted);max-width:28em;font-size:.95rem}
a.game{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;padding:22px 24px;color:var(--ink);text-decoration:none;
  font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.12em;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(135deg,rgba(242,184,198,.16),rgba(214,180,110,.08));box-shadow:0 6px 0 rgba(0,0,0,.2);transition:border-color .25s,background .25s,transform .25s}
a.game:hover{border-color:var(--gold);background:rgba(214,180,110,.08);transform:translateY(-2px)}
a.game .ic{font-family:"Playfair Display",serif;font-style:italic;font-weight:500;font-size:1.8rem;color:var(--gold);background:rgba(255,255,255,.08);width:58px;height:58px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%}
a.game span.d{display:block;font-family:var(--f-body);font-weight:500;font-size:.92rem;letter-spacing:.04em;color:var(--muted)}
a.game .go{color:var(--gold);font-size:1.4rem}
.foot{text-align:center;color:var(--gold);font-family:"Playfair Display",serif;font-style:italic;letter-spacing:.08em;margin-top:10px}
</style>
<link rel="stylesheet" href="party.css?v=6">
<script src="party.js?v=4" defer></script>
</head>
<body>
<main>
<div class="hero">
<div class="big25">25</div>
<div class="script">🎂 Happy 25th Birthday 🎂</div>
<h1>派對遊戲</h1>
<div class="rule" aria-hidden="true">✦</div>
<p>主持人用電腦打開遊戲、開房間；大家用手機打開同一個遊戲，輸入房間碼就能加入。</p>
</div>
<a class="game" href="song.html?v=21"><span class="ic" aria-hidden="true">🎵</span><div>猜歌派對<span class="d">播一段歌，大家用手機猜歌名</span></div><span class="go" aria-hidden="true">→</span></a>
<p class="foot">— with love, cheers to 25 —</p>
</main>
</body>
</html>
