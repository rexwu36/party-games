<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>派對遊戲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&family=Chiron+GoRound+TC:wght@500;700;900&family=Fredoka:wght@600;700&display=swap">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-size:17px;line-height:1.5;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.cake{font-size:4.2rem;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
h1{margin:0;font-weight:900;font-size:clamp(2.4rem,9vw,3.4rem);line-height:1.1;color:var(--sun);text-shadow:0 4px 0 #b8326e}
.hero p{margin:0;color:var(--muted);max-width:30em}
a.game{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding:20px 22px;border-radius:24px;color:#fff;text-decoration:none;
  font-weight:900;font-size:1.6rem;border:3px solid rgba(255,255,255,.85);box-shadow:0 7px 0 rgba(0,0,0,.3);transition:transform .12s}
a.game:hover{transform:translateY(-3px) rotate(-.6deg)}
a.game:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
a.game .ic{font-size:2.6rem;width:64px;height:64px;display:grid;place-items:center;background:rgba(255,255,255,.25);border-radius:50%}
a.game span{display:block;font-weight:500;font-size:1rem;opacity:.95}
a.game .go{font-size:1.8rem}
a.game:focus-visible{outline:4px solid var(--sun);outline-offset:4px}
.q{background:linear-gradient(135deg,#ff6a8f,#ff3d6e)}.s{background:linear-gradient(135deg,#8b4dff,#2f7cf6)}
.foot{text-align:center;color:var(--muted);font-size:.9rem}
</style>
<link rel="stylesheet" href="party.css?v=1">
<script src="party.js?v=1" defer></script>
</head>
<body>
<main>
<div class="hero">
<div class="cake" aria-hidden="true">🎂</div>
<h1>派對遊戲</h1>
<p>主持人用電腦打開遊戲、開房間；大家用手機打開同一個遊戲，輸入房間碼就能加入。</p>
</div>
<a class="game q" href="quiz.html?v=8"><span class="ic" aria-hidden="true">🎈</span><div>搶答派對<span>選擇題即時搶答，內建「年度大事」題庫</span></div><span class="go" aria-hidden="true">›</span></a>
<a class="game s" href="song.html?v=15"><span class="ic" aria-hidden="true">🎵</span><div>猜歌派對<span>播一段歌，大家用手機猜歌名</span></div><span class="go" aria-hidden="true">›</span></a>
<p class="foot">🎉 祝壽星生日快樂 🎉</p>
</main>
</body>
</html>
